train:
  get_spectrogram:
    _target_: torchaudio.transforms.MelSpectrogram
    sample_rate: 16000
    n_fft: 512
    win_length: 400
    hop_length: 160
    n_mels: 80
    f_min: 0
    f_max: 8000
  audio:
    _target_: torchvision.transforms.v2.Compose
    transforms:
      - _target_: src.transforms.wav_augs.Gain
        min_gain_db: -6
        max_gain_db: 3
        p: 0.25
      - _target_: src.transforms.wav_augs.PitchShift
        min_semitones: -4
        max_semitones: 4
        p: 0.25
      - _target_: src.transforms.wav_augs.TimeStretch
        min_rate: 0.75
        max_rate: 1.5
        p: 0.25
      - _target_: src.transforms.wav_augs.AddBackgroundNoise
        min_snr_db: 15
        max_snr_db: 30
        p: 0.25
  spectrogram:
    _target_: torchvision.transforms.v2.Compose
    transforms:
      - _target_: src.transforms.spec_augs.SpecAugment
        freq_mask_param: 15
        time_mask_param: 20
        num_freq_masks: 2
        num_time_masks: 2
        p: 0.2
inference:
  get_spectrogram:
    _target_: torchaudio.transforms.MelSpectrogram
    sample_rate: 16000
    n_fft: 512
    win_length: 400
    hop_length: 160
    n_mels: 80
    f_min: 0
    f_max: 8000
